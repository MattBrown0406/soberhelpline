<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#142a47">
  <title>Email confirmed | Sober Helpline</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fbf6ee;
      color: #22302f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main {
      width: min(100%, 430px);
      padding: 40px 28px;
      border: 1px solid #e5ded3;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 8px 32px rgba(20, 42, 71, .08);
    }
    .mark {
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #e7f4ec;
      color: #33543f;
      font-size: 38px;
      font-weight: 800;
    }
    h1 { margin: 0 0 12px; color: #142a47; font-size: 28px; line-height: 1.15; }
    p { margin: 0; color: #5c6a68; font-size: 16px; line-height: 1.55; }
    a.button {
      display: block;
      margin-top: 24px;
      padding: 15px 22px;
      border-radius: 14px;
      background: #142a47;
      color: #fff;
      font-size: 16px;
      font-weight: 750;
      text-decoration: none;
    }
    .help { margin-top: 16px; font-size: 13px; color: #788482; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>Your email is confirmed</h1>
    <p>Your Sober Helpline account is ready. Open the app and sign in with the email and password you chose.</p>
    <a class="button" href="sober-helpline://">Open Sober Helpline</a>
    <p class="help">If the button does not open the app, return to your home screen and open Sober Helpline there.</p>
  </main>
</body>
</html>
